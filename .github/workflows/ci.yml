name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  migration-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify migration layout and schema drift
        run: npx tsx scripts/check-migrations.ts
        env:
          CHECKSUM_CI_SKIP_MISSING: "1"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck (application sources)
        run: npx tsc -p tsconfig.build.json --noEmit
      - name: Build
        run: npm run build
      - name: Verify build artifacts
        run: test -f dist/src/index.js
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
      - name: Build Vercel bundle
        run: npm run build:vercel
      - name: Smoke test Vercel bundle
        run: node scripts/smoke-vercel-bundle.mjs

  openapi-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check OpenAPI backward compatibility
        run: |
          git fetch origin ${{ github.base_ref }}
          ./node_modules/.bin/optic diff docs/openapi.json --base FETCH_HEAD --check
