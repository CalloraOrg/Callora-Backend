  /api/webhooks/deliver/{developerId}:
    post:
      summary: Deliver a signed webhook event
      description: >
        Receives a signed webhook event payload from an external system. The
        request must include an HMAC-SHA256 signature in the
        `X-Callora-Signature-256` header, an ISO-8601 timestamp in
        `X-Callora-Timestamp`, and a unique nonce in `X-Callora-Nonce`.
        The signed payload is `<timestamp>.<nonce>.<rawBody>`. The signature
        is verified against all active secrets (current and grace-period
        previous) using constant-time comparison. Reused nonces and timestamps
        outside the tolerance window are rejected. Failure responses never
        identify which key matched.
      parameters:
        - name: developerId
          in: path
          required: true
          description: Developer identifier.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,127}$"
          examples:
            valid:
              summary: Valid developer ID
              value: dev-123
        - name: X-Callora-Signature-256
          in: header
          required: true
          description: >
            HMAC-SHA256 of `<timestamp>.<nonce>.<rawBody>`, prefixed with
            `sha256=`. Compared in constant time against the current secret
            and any previous secret still inside the rotation grace window.
            Failure responses never identify which key matched.
          schema:
            type: string
          examples:
            signature:
              summary: Example signature header
              value: "sha256=abc123def456..."
        - name: X-Callora-Timestamp
          in: header
          required: true
          description: ISO-8601 timestamp of when the event was sent. Rejected when outside the configured skew window.
          schema:
            type: string
          examples:
            ts:
              summary: Example timestamp header
              value: "2026-07-27T09:30:00.000Z"
        - name: X-Callora-Nonce
          in: header
          required: true
          description: >
            Unique request nonce (16–128 URL-safe characters). Bound into the
            HMAC and persisted for the timestamp window so replays are rejected.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: "^[A-Za-z0-9._-]{16,128}$"
          examples:
            nonce:
              summary: Example nonce header
              value: "nonce-7c9e6679-7425-40de"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDeliveryPayload"
            examples:
              newApiCall:
                summary: Deliver a new_api_call event
                value:
                  event: new_api_call
                  timestamp: "2026-07-27T09:30:00.000Z"
                  developerId: dev-123
                  data:
                    apiId: api-456
                    endpoint: /v1/checkout
                    method: POST
                    statusCode: 200
                    latencyMs: 145
                    creditsUsed: 10
              settlementCompleted:
                summary: Deliver a settlement_completed event
                value:
                  event: settlement_completed
                  timestamp: "2026-07-27T09:35:00.000Z"
                  developerId: dev-123
                  data:
                    settlementId: stl-789
                    amountCredits: 500
                    currency: XLM
              lowBalanceAlert:
                summary: Deliver a low_balance_alert event
                value:
                  event: low_balance_alert
                  timestamp: "2026-07-27T09:40:00.000Z"
                  developerId: dev-123
                  data:
                    currentBalance: 50
                    thresholdCredits: 100
      responses:
        "200":
          description: Webhook delivery accepted and payload echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryResponse"
              examples:
                accepted:
                  summary: Delivery accepted — payload echoed back
                  value:
                    message: Webhook delivery accepted.
                    body:
                      event: new_api_call
                      timestamp: "2026-07-27T09:30:00.000Z"
                      developerId: dev-123
                      data:
                        apiId: api-456
                        endpoint: /v1/checkout
                        method: POST
                        statusCode: 200
                        latencyMs: 145
                        creditsUsed: 10
        "400":
          description: Signature headers are missing or the payload is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                missingSignature:
                  summary: X-Callora-Signature-256 or X-Callora-Timestamp header absent
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Missing required webhook signature headers
                    requestId: req-webhook-deliver-400-sig
                    timestamp: "2026-07-27T09:31:00.000Z"
        "401":
          description: HMAC signature verification failed, timestamp outside the skew window, or nonce replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                invalidSignature:
                  summary: Signature does not match any active secret
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Webhook signature verification failed
                    requestId: req-webhook-deliver-401-invalid
                    timestamp: "2026-07-27T09:32:00.000Z"
                nonceReplayed:
                  summary: Nonce was already consumed (replay)
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Webhook signature verification failed
                    requestId: req-webhook-deliver-401-replay
                    timestamp: "2026-07-27T09:32:30.000Z"
        "404":
          description: No webhook registered for this developer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: Developer has no registered webhook
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: No webhook registered for this developer.
                    requestId: req-webhook-deliver-404
                    timestamp: "2026-07-27T09:33:00.000Z"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SpikeSeverity:
      type: string
      enum: [low, medium, high, critical]
    SpikeRunResponse:
      type: object
      required: [success, message, delay, elapsed]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        delay:
          type: integer
        elapsed:
          type: integer
    SpikeRecord:
      type: object
      required: [id, label, severity, createdAt, updatedAt]
      properties:
        id:
          type: string
        label:
          type: string
          minLength: 1
        severity:
          $ref: "#/components/schemas/SpikeSeverity"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SpikeRecordsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/SpikeRecord"
    SpikeCreateRequest:
      type: object
      required: [label, severity]
      properties:
        label:
          type: string
          minLength: 1
        severity:
          $ref: "#/components/schemas/SpikeSeverity"
    SpikeUpdateRequest:
      type: object
      description: At least one field should be provided.
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        severity:
          $ref: "#/components/schemas/SpikeSeverity"
    RateLimitDependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, down]
        responseTime:
          type: number
        error:
          type: string
        details:
          type: object
          additionalProperties: true
    RateLimitHealthResponse:
      type: object
      required: [status, timestamp, dependencies]
      properties:
        status:
          type: string
          enum: [ok, down]
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RateLimitDependencyStatus"
    RateLimitCheckResponse:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
        - type: object
          required: [status, reason, retryAfterMs]
          properties:
            status:
              type: string
              enum: [deny]
            reason:
              type: string
              enum: [rate_limit_exceeded]
            retryAfterMs:
              type: integer
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
