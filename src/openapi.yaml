        message:
          type: string
        requestId:
          type: string
    ErrorRecord:
      type: object
      required: [id, code, message, statusCode, createdAt, updatedAt]
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
        statusCode:
          type: integer
        description:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorRecordResponse:
      type: object
