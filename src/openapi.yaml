          maxLength: 500
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        description:
          type: [string, "null"]
          maxLength: 1000
    ErrorUpdateRequest:
      type: object
      description: At least one field must be provided.
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        description:
          type: [string, "null"]
          maxLength: 1000
    # ---------------------------------------------------------------------------
    # Webhook schemas
    # ---------------------------------------------------------------------------
    WebhookEventType:
      type: string
      enum:
        - new_api_call
        - settlement_completed
        - low_balance_alert
        - usage_event.created
      description: >
        Supported webhook event types. Subscribe to one or more in the
        `events` array when registering.
    WebhookRetryPolicy:
      type: object
      description: >
        Controls reattempt behaviour when the target URL does not return 2xx.
        At least one of `maxRetries` or `baseDelayMs` must be provided.
      minProperties: 1
      properties:
        maxRetries:
          type: integer
          minimum: 0
          maximum: 10
          description: Maximum number of delivery attempts after the initial failure (0–10).
        baseDelayMs:
          type: integer
          minimum: 100
          maximum: 60000
          description: >
            Base delay in milliseconds before the first retry. Subsequent
            retries use exponential back-off up to this ceiling (100–60 000 ms).
      additionalProperties: false
    WebhookRegisterRequest:
      type: object
      required: [developerId, url, events]
      description: >
        Request body for POST /api/webhooks. The `events` array must be
        non-empty and contain only supported WebhookEventType values. The
        optional `secret` seeds the HMAC-SHA256 signing key; when omitted the
        server generates a 64-character hex secret automatically.
      properties:
        developerId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,127}$"
          description: Developer identifier (3–128 chars, alphanumeric/underscore/hyphen).
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >
            Absolute HTTPS URL that will receive event POST requests. The URL
            is validated for reachability at registration time.
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
          minItems: 1
          description: One or more event types to subscribe to.
        secret:
          type: string
          minLength: 8
          maxLength: 256
          description: >
            Optional HMAC signing secret (8–256 chars). If omitted the server
            generates one automatically.
        retryPolicy:
          $ref: "#/components/schemas/WebhookRetryPolicy"
      additionalProperties: false
    WebhookRegisterResponse:
      type: object
      required: [message, developerId, url, events]
      description: Response body for a successful POST /api/webhooks (201).
      properties:
        message:
          type: string
          example: Webhook registered successfully.
        developerId:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
    WebhookConfig:
      type: object
      required: [developerId, url, events]
      description: >
        Webhook configuration returned by GET /api/webhooks/{developerId}.
        Signing secrets are never included in this response.
      properties:
        developerId:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        retryPolicy:
          $ref: "#/components/schemas/WebhookRetryPolicy"
        createdAt:
          type: string
          format: date-time
    WebhookDeleteResponse:
      type: object
      required: [message]
      description: Response body for a successful DELETE /api/webhooks/{developerId}.
      properties:
        message:
          type: string
          example: Webhook removed.
    WebhookRotateSecretResponse:
      type: object
      required: [message, developerId, secret]
      description: >
        Response body for a successful POST /api/webhooks/{developerId}/rotate-secret.
        The new secret is returned once only — store it immediately.
      properties:
        message:
          type: string
          example: Webhook secret rotated successfully.
        developerId:
          type: string
        secret:
          type: string
          description: The new HMAC-SHA256 signing secret (64 hex chars).
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
        previous_expires_at:
          type: string
          format: date-time
          description: >
            UTC timestamp after which the previous secret is no longer valid.
            Consumers should rotate to the new secret before this time.
    WebhookRetryPolicyUpdateRequest:
      type: object
      description: >
        Request body for PATCH /api/webhooks/{developerId}/retry-policy. The
        `retryPolicy` object must include at least one field.
      properties:
        retryPolicy:
          $ref: "#/components/schemas/WebhookRetryPolicy"
      additionalProperties: false
    WebhookRetryPolicyUpdateResponse:
      type: object
      required: [message, developerId, url, events]
      description: >
        Response body for a successful PATCH /api/webhooks/{developerId}/retry-policy.
        Returns the full webhook config with the updated retry policy applied.
      properties:
        message:
          type: string
          example: Webhook retry policy updated successfully.
        developerId:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        retryPolicy:
          $ref: "#/components/schemas/WebhookRetryPolicy"
        createdAt:
          type: string
          format: date-time
    WebhookDeliveryPayload:
      type: object
      required: [event, timestamp, developerId, data]
      description: >
        Signed event payload for POST /api/webhooks/deliver/{developerId}.
        The request must carry an `X-Callora-Signature-256` header (HMAC-SHA256
        over the raw body) and an `X-Callora-Timestamp` header (Unix seconds).
      properties:
        event:
          $ref: "#/components/schemas/WebhookEventType"
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 datetime when the event was emitted.
        developerId:
          type: string
          description: Developer for whom this event is intended.
        data:
          type: object
          additionalProperties: true
          description: >
            Event-specific payload. Keys and value types depend on the event
            type (e.g. `apiId`, `latencyMs` for `new_api_call`).
      additionalProperties: false
    WebhookDeliveryResponse:
      type: object
      required: [message, body]
      description: >
        Response body for a successful POST /api/webhooks/deliver/{developerId}.
        The received payload is echoed back for debugging.
      properties:
        message:
          type: string
          example: Webhook delivery accepted.
        body:
          $ref: "#/components/schemas/WebhookDeliveryPayload"
    # Distinct from the pre-existing flat ErrorResponse — this matches the
    # actual envelope produced by errorHandler.ts / buildErrorEnvelope():
    # { success: false, error: { code, message, details? }, requestId, timestamp }
    StandardErrorEnvelope:
      type: object
      required: [success, error, requestId, timestamp]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
