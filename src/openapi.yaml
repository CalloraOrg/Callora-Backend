        "404":
          description: Error definition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: No error definition with the given ID
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
