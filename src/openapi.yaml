  /api/webhooks:
    post:
      summary: Register a webhook
      description: >
        Registers a new webhook endpoint for a developer. The `events` array
        must be non-empty and contain only supported event types. The optional
        `secret` is used for HMAC-SHA256 signing; if omitted the server
        generates one. The optional `retryPolicy` constrains reattempt
        behaviour (0–10 retries, 100–60 000 ms base delay).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRegisterRequest"
            examples:
              registerFull:
                summary: Register with all optional fields
                value:
                  developerId: dev-123
                  url: "https://hooks.example.com/callora"
                  events:
                    - new_api_call
                    - low_balance_alert
                  secret: s3cr3t-hmac-key
                  retryPolicy:
                    maxRetries: 3
                    baseDelayMs: 1000
              registerMinimal:
                summary: Register with required fields only
                value:
                  developerId: dev-456
                  url: "https://hooks.example.com/minimal"
                  events:
                    - settlement_completed
      responses:
        "201":
          description: Webhook registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRegisterResponse"
              examples:
                registered:
                  summary: Registration confirmed
                  value:
                    message: Webhook registered successfully.
                    developerId: dev-123
                    url: "https://hooks.example.com/callora"
                    events:
                      - new_api_call
                      - low_balance_alert
        "400":
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                missingFields:
                  summary: developerId, url, or events missing
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: "developerId, url, and a non-empty events array are required."
                    requestId: req-webhook-post-400-missing
                    timestamp: "2026-07-27T09:15:00.000Z"
                invalidEventTypes:
                  summary: Event type not in the supported set
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: "Invalid event types: invalid_event. Valid: new_api_call, settlement_completed, low_balance_alert"
                    requestId: req-webhook-post-400-events
                    timestamp: "2026-07-27T09:16:00.000Z"
                invalidUrl:
                  summary: URL failed reachability validation
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: URL is not reachable or does not return 2xx
                    requestId: req-webhook-post-400-url
                    timestamp: "2026-07-27T09:17:00.000Z"
                invalidRetryPolicy:
                  summary: Retry policy values out of range
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: retryPolicy.maxRetries must be between 0 and 10
                    requestId: req-webhook-post-400-retry
                    timestamp: "2026-07-27T09:18:00.000Z"
  /api/webhooks/{developerId}:
    parameters:
      - name: developerId
        in: path
