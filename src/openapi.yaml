  /api/webhooks/{developerId}/rotate-secret:
    post:
      summary: Rotate webhook signing secret
      description: >
        Rotates the HMAC-SHA256 signing secret for the developer's webhook. The
        previous secret remains valid for a configurable grace period
        (WEBHOOK_SECRET_ROTATION_GRACE_MS) so consumers can transition without
        delivery gaps. The new secret is returned once and never again — store
        it immediately.
      parameters:
        - name: developerId
          in: path
          required: true
          description: Developer identifier.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,127}$"
          examples:
            valid:
              summary: Valid developer ID
              value: dev-123
      responses:
        "200":
          description: Secret rotated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRotateSecretResponse"
              examples:
                rotated:
                  summary: New secret and grace-period expiry returned
                  value:
                    message: Webhook secret rotated successfully.
                    developerId: dev-123
                    secret: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
                    previous_expires_at: "2026-07-27T10:15:00.000Z"
        "404":
          description: No webhook registered for this developer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: Developer has no registered webhook
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: No webhook registered for this developer.
                    requestId: req-webhook-rotate-404
                    timestamp: "2026-07-27T09:20:00.000Z"
