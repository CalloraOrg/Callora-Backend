# OpenAPI fragment: example request/response bodies
#
# Canonical full contract lives in docs/openapi.json (served at GET /api/openapi.json).
# This YAML file documents request/response examples for individual API surfaces.
# Keep examples in sync with docs/openapi.json — companion tests assert both:
#   - rate-limit surface (GrantFox FWC26 #931): src/routes/rate-limit/health.openapi.test.ts
#   - error-definitions surface (GrantFox FWC26 #891): src/routes/errors.openapi.test.ts
openapi: 3.1.0
info:
  title: Callora API examples
  version: "1.0.0"
  description: >
    Example request/response bodies for select Callora API surfaces: the
    spike probe / record API, the rate-limit health probe / budget peek, and
    the error-definitions CRUD API.
paths:
  /api/spike:
    get:
      summary: Run the spike timeout probe
      description: >
        Exercises timeout handling by delaying for the requested duration. No
        request body is required.
      parameters:
        - name: delay
          in: query
          required: false
          description: Delay in milliseconds before responding.
          schema:
            type: integer
            minimum: 1
            default: 2000
          examples:
            completesBeforeTimeout:
              summary: Complete before the default timeout
              value: 100
            exceedsDefaultTimeout:
              summary: Trigger the default timeout
              value: 1200
        - name: timeout
          in: query
          required: false
          description: Optional request timeout override in milliseconds.
          schema:
            type: integer
            minimum: 1
          examples:
            shortTimeout:
              summary: Custom timeout shorter than the delay
              value: 200
        - name: x-timeout-ms
          in: header
          required: false
          description: Optional request timeout override in milliseconds.
          schema:
            type: integer
            minimum: 1
          examples:
            headerTimeout:
              summary: Header-based timeout override
              value: 200
      responses:
        "200":
          description: Spike probe completed before the timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpikeRunResponse"
              examples:
                completed:
                  summary: Delay completed successfully
                  value:
                    success: true
                    message: Spike completed successfully
                    delay: 100
                    elapsed: 100
        "504":
          description: Spike probe exceeded the configured timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                timedOut:
                  summary: Request timed out
                  value:
                    success: false
                    error:
                      code: GATEWAY_TIMEOUT
                      message: Request timeout exceeded
                    requestId: req-spike-timeout-1
                    timestamp: "2026-07-29T10:00:00.000Z"
    post:
      summary: Create a spike record
      description: >
        Creates an in-memory spike record and records the mutation in the audit
        trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpikeCreateRequest"
            examples:
              createHighSeverityRecord:
                summary: Create a high severity spike record
                value:
                  label: Checkout latency spike
                  severity: high
      responses:
        "201":
          description: Spike record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpikeRecord"
              examples:
                created:
                  summary: Newly created spike record
                  value:
                    id: "1"
                    label: Checkout latency spike
                    severity: high
                    createdAt: "2026-07-29T10:00:00.000Z"
                    updatedAt: "2026-07-29T10:00:00.000Z"
        "400":
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                missingLabel:
                  summary: Missing required label
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: label is required and must be a non-empty string
                    requestId: req-spike-create-400
                    timestamp: "2026-07-29T10:01:00.000Z"
        "503":
          description: Audit service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                auditUnavailable:
                  summary: Audit circuit breaker is open
                  value:
                    success: false
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Audit service temporarily unavailable
                    requestId: req-spike-create-503
                    timestamp: "2026-07-29T10:02:00.000Z"
  /api/spike/records:
    get:
      summary: List spike records
      description: Returns the current in-memory spike records.
      parameters: []
      responses:
        "200":
          description: Spike records retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpikeRecordsResponse"
              examples:
                withRecords:
                  summary: Store contains spike records
                  value:
                    records:
                      - id: "1"
                        label: Checkout latency spike
                        severity: high
                        createdAt: "2026-07-29T10:00:00.000Z"
                        updatedAt: "2026-07-29T10:00:00.000Z"
                empty:
                  summary: No spike records exist yet
                  value:
                    records: []
  /api/spike/{id}:
    put:
      summary: Update a spike record
      description: >
        Updates the label and/or severity for an existing spike record and
        records the mutation in the audit trail.
      parameters:
        - name: id
          in: path
          required: true
          description: Spike record identifier.
          schema:
            type: string
          examples:
            existingRecord:
              summary: Existing spike record
              value: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpikeUpdateRequest"
            examples:
              updateSeverity:
                summary: Escalate the spike severity
                value:
                  label: Checkout latency spike escalated
                  severity: critical
      responses:
        "200":
          description: Spike record updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpikeRecord"
              examples:
                updated:
                  summary: Updated spike record
                  value:
                    id: "1"
                    label: Checkout latency spike escalated
                    severity: critical
                    createdAt: "2026-07-29T10:00:00.000Z"
                    updatedAt: "2026-07-29T10:05:00.000Z"
        "400":
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                invalidSeverity:
                  summary: Severity is outside the allowed set
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Invalid option
                    requestId: req-spike-update-400
                    timestamp: "2026-07-29T10:06:00.000Z"
        "404":
          description: Spike record was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: No record exists for the supplied ID
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Spike record 999 not found
                    requestId: req-spike-update-404
                    timestamp: "2026-07-29T10:07:00.000Z"
        "503":
          description: Audit service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                auditUnavailable:
                  summary: Audit circuit breaker is open
                  value:
                    success: false
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Audit service temporarily unavailable
                    requestId: req-spike-update-503
                    timestamp: "2026-07-29T10:08:00.000Z"
    delete:
      summary: Delete a spike record
      description: >
        Deletes an existing spike record and records the mutation in the audit
        trail. Returns no content on success.
      parameters:
        - name: id
          in: path
          required: true
          description: Spike record identifier.
          schema:
            type: string
          examples:
            existingRecord:
              summary: Existing spike record
              value: "1"
      responses:
        "204":
          description: Spike record deleted.
        "404":
          description: Spike record was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: No record exists for the supplied ID
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Spike record 999 not found
                    requestId: req-spike-delete-404
                    timestamp: "2026-07-29T10:09:00.000Z"
        "503":
          description: Audit service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                auditUnavailable:
                  summary: Audit circuit breaker is open
                  value:
                    success: false
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Audit service temporarily unavailable
                    requestId: req-spike-delete-503
                    timestamp: "2026-07-29T10:10:00.000Z"
  /api/rate-limit/health:
    get:
      summary: Check rate-limit subsystem health
      description: >
        Public probe. Does not consume rate-limit budget and does not require
        a request body.
      parameters: []
      responses:
        "200":
          description: Rate-limit subsystem is operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitHealthResponse"
              examples:
                operational:
                  summary: In-memory limiter is operational
                  value:
                    status: ok
                    timestamp: "2026-07-28T10:00:00.000Z"
                    dependencies:
                      in_memory_store:
                        status: ok
                        responseTime: 0.123
                        details:
                          windowMs: 60000
                          maxRequests: 100
                notConfigured:
                  summary: No limiter configured
                  value:
                    status: ok
                    timestamp: "2026-07-28T10:00:00.000Z"
                    dependencies:
                      in_memory_store:
                        status: ok
                        details:
                          note: No rate limiter configured for probing
        "503":
          description: Rate-limit subsystem is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitHealthResponse"
              examples:
                unavailable:
                  summary: Rate-limit store probe failed
                  value:
                    status: down
                    timestamp: "2026-07-28T10:00:00.000Z"
                    dependencies:
                      in_memory_store:
                        status: down
                        responseTime: 0.456
                        error: unavailable
  /api/limits/check:
    get:
      summary: Check the authenticated user's rate-limit budget
      description: >
        Peeks at the authenticated user's REST rate-limit bucket without
        consuming a token. No request body is required.
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer JWT for the authenticated user
          schema:
            type: string
          examples:
            developerBearer:
              summary: Authenticated developer JWT
              value: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example"
      responses:
        "200":
          description: Rate-limit budget status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitCheckResponse"
              examples:
                allowed:
                  summary: Requests are currently allowed
                  value:
                    status: ok
                denied:
                  summary: Rate-limit budget is exhausted
                  value:
                    status: deny
                    reason: rate_limit_exceeded
                    retryAfterMs: 42300
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: Missing or invalid authentication
                  value:
                    code: UNAUTHORIZED
                    message: Authentication required
                    requestId: req-rate-limit-check
  /api/errors:
    get:
      summary: List error definitions
      description: >
        Returns all registered error definitions. Read-only; does not require
        authentication and is not audited.
      parameters: []
      responses:
        "200":
          description: Error definitions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorsListResponse"
              examples:
                withRecords:
                  summary: Store contains registered error definitions
                  value:
                    success: true
                    data:
                      errors:
                        - id: "1"
                          code: ERR_INSUFFICIENT_CREDITS
                          message: Developer account has insufficient credits
                          statusCode: 402
                          description: >-
                            Returned when a billing deduction would take the
                            balance below zero.
                          createdAt: "2026-07-27T09:00:00.000Z"
                          updatedAt: "2026-07-27T09:00:00.000Z"
                    requestId: req-errors-list-1
                    timestamp: "2026-07-27T09:00:00.000Z"
                empty:
                  summary: No error definitions registered yet
                  value:
                    success: true
                    data:
                      errors: []
                    requestId: req-errors-list-2
                    timestamp: "2026-07-27T09:05:00.000Z"
    post:
      summary: Create an error definition
      description: >
        Registers a new error definition. Requires authentication; the
        mutation is recorded in the audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorCreateRequest"
            examples:
              createErrorDefinition:
                summary: Register a new billing error code
                value:
                  code: ERR_INSUFFICIENT_CREDITS
                  message: Developer account has insufficient credits
                  statusCode: 402
                  description: >-
                    Returned when a billing deduction would take the balance
                    below zero.
      responses:
        "201":
          description: Error definition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRecordResponse"
              examples:
                created:
                  summary: Newly created error definition
                  value:
                    success: true
                    data:
                      id: "1"
                      code: ERR_INSUFFICIENT_CREDITS
                      message: Developer account has insufficient credits
                      statusCode: 402
                      description: >-
                        Returned when a billing deduction would take the
                        balance below zero.
                      createdAt: "2026-07-27T09:00:00.000Z"
                      updatedAt: "2026-07-27T09:00:00.000Z"
                    requestId: req-errors-create-1
                    timestamp: "2026-07-27T09:00:00.000Z"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                validationFailed:
                  summary: Missing required field
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Validation failed
                      details:
                        - field: code
                          message: Required
                          code: invalid_type
                    requestId: req-errors-create-400
                    timestamp: "2026-07-27T09:01:00.000Z"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                unauthorized:
                  summary: Missing or invalid authentication
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized
                    requestId: req-errors-create-401
                    timestamp: "2026-07-27T09:02:00.000Z"
  /api/errors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Error definition ID
        schema:
          type: string
    get:
      summary: Get an error definition by ID
      description: >
        Read-only; does not require authentication and is not audited.
      responses:
        "200":
          description: Error definition retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRecordResponse"
              examples:
                found:
                  summary: Existing error definition
                  value:
                    success: true
                    data:
                      id: "1"
                      code: ERR_INSUFFICIENT_CREDITS
                      message: Developer account has insufficient credits
                      statusCode: 402
                      description: >-
                        Returned when a billing deduction would take the
                        balance below zero.
                      createdAt: "2026-07-27T09:00:00.000Z"
                      updatedAt: "2026-07-27T09:00:00.000Z"
                    requestId: req-errors-get-1
                    timestamp: "2026-07-27T09:03:00.000Z"
        "404":
          description: Error definition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: No error definition with the given ID
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Error definition 999 not found
                    requestId: req-errors-get-404
                    timestamp: "2026-07-27T09:04:00.000Z"
    put:
      summary: Replace an error definition
      description: >
        Full update of an existing error definition. Requires authentication;
        the mutation is recorded in the audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorUpdateRequest"
            examples:
              replaceErrorDefinition:
                summary: Update the message and status code
                value:
                  code: ERR_INSUFFICIENT_CREDITS
                  message: Account balance is below the required minimum
                  statusCode: 402
                  description: >-
                    Returned when a billing deduction would take the balance
                    below zero.
      responses:
        "200":
          description: Error definition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRecordResponse"
              examples:
                updated:
                  summary: Updated error definition
                  value:
                    success: true
                    data:
                      id: "1"
                      code: ERR_INSUFFICIENT_CREDITS
                      message: Account balance is below the required minimum
                      statusCode: 402
                      description: >-
                        Returned when a billing deduction would take the
                        balance below zero.
                      createdAt: "2026-07-27T09:00:00.000Z"
                      updatedAt: "2026-07-27T09:06:00.000Z"
                    requestId: req-errors-put-1
                    timestamp: "2026-07-27T09:06:00.000Z"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                emptyUpdate:
                  summary: No fields provided
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: At least one field must be provided for update
                    requestId: req-errors-put-400
                    timestamp: "2026-07-27T09:07:00.000Z"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                unauthorized:
                  summary: Missing or invalid authentication
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized
                    requestId: req-errors-put-401
                    timestamp: "2026-07-27T09:08:00.000Z"
        "404":
          description: Error definition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: No error definition with the given ID
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Error definition 999 not found
                    requestId: req-errors-put-404
                    timestamp: "2026-07-27T09:09:00.000Z"
    patch:
      summary: Partially update an error definition
      description: >
        Partial update of an existing error definition. Requires
        authentication; the mutation is recorded in the audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorUpdateRequest"
            examples:
              patchMessage:
                summary: Update just the message
                value:
                  message: Account balance is below the required minimum
      responses:
        "200":
          description: Error definition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRecordResponse"
              examples:
                updated:
                  summary: Updated error definition
                  value:
                    success: true
                    data:
                      id: "1"
                      code: ERR_INSUFFICIENT_CREDITS
                      message: Account balance is below the required minimum
                      statusCode: 402
                      description: >-
                        Returned when a billing deduction would take the
                        balance below zero.
                      createdAt: "2026-07-27T09:00:00.000Z"
                      updatedAt: "2026-07-27T09:10:00.000Z"
                    requestId: req-errors-patch-1
                    timestamp: "2026-07-27T09:10:00.000Z"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                emptyUpdate:
                  summary: No fields provided
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: At least one field must be provided for update
                    requestId: req-errors-patch-400
                    timestamp: "2026-07-27T09:11:00.000Z"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                unauthorized:
                  summary: Missing or invalid authentication
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized
                    requestId: req-errors-patch-401
                    timestamp: "2026-07-27T09:12:00.000Z"
        "404":
          description: Error definition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                notFound:
                  summary: No error definition with the given ID
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Error definition 999 not found
                    requestId: req-errors-patch-404
                    timestamp: "2026-07-27T09:13:00.000Z"
    delete:
      summary: Delete an error definition
      description: >
        Requires authentication; the mutation is recorded in the audit log.
        Returns no content on success.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Error definition deleted
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorEnvelope"
              examples:
                unauthorized:
                  summary: Missing or invalid authentication
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
